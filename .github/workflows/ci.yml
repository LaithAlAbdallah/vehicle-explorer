# Runs on every push and pull request: builds and tests both apps on a clean machine and scans for secrets.
# On main, once everything passes, it also builds the Docker image and pushes it to GitHub's registry,
# so the small AWS server only has to pull and run it.
name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet restore
      # Warnings fail the build here, so nothing sloppy reaches main.
      - run: dotnet build --no-restore -warnaserror
      - run: dotnet format --no-restore --verify-no-changes
      - run: dotnet test --no-build

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/web/package-lock.json
      - run: npm ci
      - run: npx prettier --check src
      - run: npx ng test --watch=false
      - run: npm run build

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The full history, so a secret that was added and later removed is still found.
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [backend, web, secrets]
    runs-on: ubuntu-latest
    # Lets this job push to ghcr.io with the built-in token; no password is stored anywhere.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # "latest" is what the server pulls; the commit hash tag shows exactly which code is running.
          tags: |
            ghcr.io/laithalabdallah/vehicle-explorer:latest
            ghcr.io/laithalabdallah/vehicle-explorer:${{ github.sha }}
